name: aura_habits_mobile
description: "Aura Habits — Android client (shares aura_core with the Windows app)."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^17.3.0
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.5.3
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  google_fonts: ^8.1.0
  crypto: ^3.0.7
  animations: ^2.2.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  # Mobile-specific:
  google_sign_in: ^6.2.2
  flutter_local_notifications: ^18.0.1
  share_plus: ^10.1.4
  # Shared cross-platform core (Supabase client, cloud sync, AI). Local package.
  aura_core:
    path: ../../packages/aura_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
